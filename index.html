<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F2F1EC; --paper:#FFFFFF; --ink:#1E2229; --ink-2:#4B5563; --ink-3:#7B8390;
  --line:#DCD9D1; --accent:#1E6E62; --accent-soft:#D5E8E3; --accent-ink:#0F4D44;
  --warn:#8A5A12; --radius:14px;
  --g-cuidando:#B5654A; --g-dando:#3B6EA5; --g-bem:#7A8B3A; --g-razao:#8A5A9E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181D; --paper:#1E2228; --ink:#EDEEF0; --ink-2:#B7BCC5; --ink-3:#7F8792;
    --line:#2E343C; --accent:#5FB8A8; --accent-soft:#1F3B36; --accent-ink:#BFE6DD; --warn:#E0B15A;
    --g-cuidando:#E08E70; --g-dando:#78A6DA; --g-bem:#B5C66A; --g-razao:#C394D6;
  }
}
:root[data-theme="dark"]{
  --bg:#15181D; --paper:#1E2228; --ink:#EDEEF0; --ink-2:#B7BCC5; --ink-3:#7F8792;
  --line:#2E343C; --accent:#5FB8A8; --accent-soft:#1F3B36; --accent-ink:#BFE6DD; --warn:#E0B15A;
  --g-cuidando:#E08E70; --g-dando:#78A6DA; --g-bem:#B5C66A; --g-razao:#C394D6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
main{max-width:560px;margin:0 auto;padding:18px 18px 64px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.lead{font-size:18px;color:var(--ink-2);margin:10px 0 0}
.muted{color:var(--ink-3);font-size:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{appearance:none;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:14px 22px;cursor:pointer;width:100%;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.link{appearance:none;background:none;border:0;color:var(--ink-3);font:inherit;font-size:15px;cursor:pointer;padding:8px 0;text-decoration:underline}
.prog{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:5}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.prog .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 16px;margin:10px 0}
.q h2{font-size:23px;line-height:1.25;margin:8px 0 14px}
.typ{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;line-height:1.35;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%}
.opt .box{flex:0 0 18px;height:18px;border:1.5px solid var(--ink-3);border-radius:5px;margin-top:2px}
.opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
.lb{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
input,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:11px 8px;font:inherit;font-size:15px;cursor:pointer}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.err{color:var(--warn);font-weight:700}
.grp{border-left:5px solid var(--gc,var(--accent));padding:14px 14px 12px 14px;margin:10px 0;background:var(--paper);border-radius:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grp.pick{cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.grp.pick.on{outline:3px solid var(--accent);outline-offset:2px}
.grp .gt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.mk{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:3px 0}
.mk b{font-weight:700}
.mk span{color:var(--ink-2);font-size:15px}
.others{font-size:15px;color:var(--ink-3);margin:8px 0 0}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.barrow{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:15px}
.barrow .bl{line-height:1.2}
.barrow .bt{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.barrow .bt i{display:block;height:100%;background:var(--gc,var(--accent));border-radius:6px}
.barrow .bv{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.res h1{font-size:38px;margin:6px 0 4px}
.anchor{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--radius);padding:18px;margin:14px 0}
.anchor .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.anchor .f{font-family:"Fraunces",Georgia,serif;font-size:25px;line-height:1.25;margin-top:6px;font-weight:700}
.note{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--ink-2);font-size:15.5px;margin:12px 0}
.sec{margin-top:26px}
.sec h3{font-size:20px;margin-bottom:8px}
.back{appearance:none;background:none;border:0;color:var(--ink-3);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
.mapa{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gc,var(--accent));border-radius:var(--radius);padding:16px}
.mapa h4{font-family:"Fraunces",Georgia,serif;font-size:18px;margin:10px 0 0}
.mapa .mrow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mapa .ml{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.mapa .mrow .ml{display:inline;min-width:70px}
.mapa .voz,.mapa .pt{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.4}
.mapa .voz{font-family:"Fraunces",Georgia,serif}
.mapa .voz .ml,.mapa .pt .ml{margin-bottom:2px;font-family:"Nunito Sans",system-ui,sans-serif}
.mapa .contra{margin:0;font-size:16px;line-height:1.5}
.mapa .contra em{display:block;font-family:"Fraunces",Georgia,serif;color:var(--accent-ink);margin-top:2px}
.recado{margin-top:16px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.45}
.guardar{margin-top:16px;background:var(--accent-soft);border-radius:var(--radius);padding:16px}
.guardar .lk{font-size:14px;word-break:break-all;background:var(--paper);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gbtns .btn{width:auto;flex:1 1 180px;text-align:center;text-decoration:none;display:inline-block}
details.mais{margin-top:8px}
details.mais summary{cursor:pointer;font-weight:700;color:var(--accent-ink);padding:6px 0}
details.mais .mapa{margin-top:6px}
/* painel */
.painel main{max-width:1100px}
.painel h1{font-size:42px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}
.big{font-family:"Fraunces",Georgia,serif;font-size:56px;font-weight:700;line-height:1}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.cloud span{font-family:"Fraunces",Georgia,serif;font-weight:700;color:var(--accent-ink)}
.painel .barrow{grid-template-columns:200px 1fr 48px;font-size:16px}
@media (max-width:480px){.barrow{grid-template-columns:118px 1fr 40px;font-size:14px}}
</style>
</head>

/* ======================= ESTADO ======================= */
const S = {
  who:{}, ans:{}, ord:{}, seq:[], i:0, stage:"", screen:"",
  ident1:null, grupoEscolhido:null, lowPath:false,
  refGroups:[], ident2:null, principalMedida:null, mascaraEscolhida:null,
  desN:0, deveria:"", t0:Date.now(), sent:false, result:null
};

const $ = s => document.querySelector(s);
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }
function zeroG(){ return {cuidando:0,dando:0,bem:0,razao:0}; }
function rank(obj){ return Object.keys(obj).sort((x,y)=> (obj[y]-obj[x]) || (GORD.indexOf(M[x]?M[x].g:x)-GORD.indexOf(M[y]?M[y].g:y))); }
function scrollTop(){ window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"}); }

/* ======================= PONTUAÇÃO ======================= */
function triScores(){
  const s = zeroG();
  TRI.forEach((q,i)=>{ const v=S.ans["tri"+i]; if(typeof v==="number") s[q.g]+=v; });
  if (S.ans.triIrr) s[S.ans.triIrr] += 2;
  if (S.ans.triTb) s[S.ans.triTb] += 2;
  return s;
}
function indScores(){
  const s = zeroG();
  IND.forEach((q,i)=>{ const v=S.ans["ind"+i]; if(v) s[v]+=1; });
  return s;
}
function groupScores(){
  const a=triScores(), b=indScores(), s=zeroG();
  GORD.forEach(g=> s[g]=a[g]+b[g]);
  return s;
}
function maskScores(){
  const s = {};
  S.refGroups.forEach(g=> G[g].m.forEach(k=> s[k]=0));
  S.refGroups.forEach(g=>{
    ["c1","c2","irr","con"].forEach(p=>{ const v=S.ans["ref_"+g+"_"+p]; if(v && v in s) s[v]+=2; });
    (S.ans["ref_"+g+"_fr"]||[]).forEach(x=>{ const k=x.split("#")[0]; if(k in s) s[k]+=1; });
  });
  return s;
}
function duelo(){
  /* desempate = duelo: as duas começam empatadas na nota da mais alta; quem leva mais votos vence */
  const a=S.principalMedida, b=S.mascaraEscolhida;
  if (!a || !b || a===b || !S.desN) return null;
  let va=0, vb=0;
  for (let i=0;i<S.desN;i++){ const v=S.ans["des"+i]; if(v===a) va++; else if(v===b) vb++; }
  return {a, b, va, vb};
}
function finalScores(){
  const s = maskScores();
  if (S.mascaraEscolhida && !(S.mascaraEscolhida in s)) s[S.mascaraEscolhida]=0;
  const d = duelo();
  if (d){
    const base = s[d.a];
    s[d.a] = base + 3*d.va + (d.va===d.vb ? 0.5 : 0);
    s[d.b] = base + 3*d.vb;
  }
  return s;
}

/* ======================= SEQUÊNCIAS ======================= */
function qTri(){
  const qs = TRI.map((q,i)=>({id:"tri"+i, kind:"likert", typ:"quanto é você", t:q.t, opts:LIKERT}));
  qs.push({id:"triIrr", kind:"one", typ:TRI_IRR.typ, t:TRI_IRR.t, opts:TRI_IRR.opts, shuffle:true});
  qs.push({id:"triTb", kind:"one", typ:TRI_TB.typ, t:TRI_TB.t, opts:TRI_TB.opts, shuffle:true});
  return qs;
}
function qInd(){ return IND.map((q,i)=>({id:"ind"+i, kind:"one", typ:q.typ, t:q.t, opts:q.opts, shuffle:true})); }
function qRef(){
  const qs=[];
  S.refGroups.forEach(g=>{
    const ms=G[g].m, R=REF[g];
    qs.push({id:"ref_"+g+"_c1", kind:"one", typ:"a cena", t:R.c1.t, opts:ms.map(k=>({k, t:R.c1.o[k]})), shuffle:true});
    qs.push({id:"ref_"+g+"_fr", kind:"multi", typ:"frases da sua boca", t:"Quais dessas saíram da sua boca nos últimos 7 dias? Marca todas.", opts:frasesIntercaladas(ms), shuffle:false});
    qs.push({id:"ref_"+g+"_irr", kind:"one", typ:"o que te irrita", t:"Qual dessas te irrita MAIS?", opts:ms.map(k=>({k, t:M[k].irr})), shuffle:true});
    qs.push({id:"ref_"+g+"_c2", kind:"one", typ:"a cena", t:R.c2.t, opts:ms.map(k=>({k, t:R.c2.o[k]})), shuffle:true});
    qs.push({id:"ref_"+g+"_con", kind:"one", typ:"quem te conhece", t:"O que a pessoa que mais te conhece diria sobre você?", opts:ms.map(k=>({k, t:"“"+M[k].con+"”"})), shuffle:true});
  });
  return qs;
}
/* duas rodadas, cada máscara uma vez por rodada; a 1ª da 2ª rodada nunca repete a última da 1ª */
function frasesIntercaladas(ms){
  const r1=shuffle(ms), r2=shuffle(ms);
  if (r2.length>1 && r2[0]===r1[r1.length-1]) { const t=r2[0]; r2[0]=r2[1]; r2[1]=t; }
  const j={}; ms.forEach(k=> j[k]= Math.random()<0.5 ? 0 : 1);
  return r1.map(k=>({k:k+"#"+j[k], t:"“"+M[k].fr[j[k]]+"”"})).concat(r2.map(k=>({k:k+"#"+(1-j[k]), t:"“"+M[k].fr[1-j[k]]+"”"})));
}
function qDes(a, b){
  const qs=[]; const key=[a,b].sort().join("|");
  if (PAR[key]) qs.push({t:PAR[key].t, opts:[{k:a,t:PAR[key].o[a]},{k:b,t:PAR[key].o[b]}]});
  qs.push({t:"Qual dessas frases é mais verdade pra você?", opts:[{k:a,t:"“"+M[a].me+"”"},{k:b,t:"“"+M[b].me+"”"}]});
  qs.push({t:"Qual dessas te irrita MAIS?", opts:[{k:a,t:M[a].irr},{k:b,t:M[b].irr}]});
  qs.push({t:"O que a pessoa que mais te conhece diria?", opts:[{k:a,t:"“"+M[a].con+"”"},{k:b,t:"“"+M[b].con+"”"}]});
  S.desN = qs.length;
  return qs.map((q,i)=>({id:"des"+i, kind:"one", typ:"desempate", t:q.t, opts:q.opts, shuffle:true}));
}

const STAGE_LABEL = {tri:"Etapa 1 de 3 · Primeiras pistas", ind:"Etapa 1 de 3 · Por outro caminho", ref:"Etapa 2 de 3 · De perto", des:"Etapa 3 de 3 · Desempate"};

function startStage(stage, qs){ S.stage=stage; S.seq=qs; S.i=0; renderQ(); }

function next(){
  if (S.i < S.seq.length-1){ S.i++; renderQ(); return; }
  endStage(S.stage);
}
function endStage(stage){
  if (stage==="tri"){
    const s=triScores(); const mx=Math.max.apply(null, GORD.map(g=>s[g]));
    if (mx<=4){ S.lowPath=true; startStage("ind", qInd()); return; }
    renderRes1(); return;
  }
  if (stage==="ind"){
    const r=rank(groupScores()); const g1=r[0];
    const g2=(S.grupoEscolhido && S.grupoEscolhido!==g1) ? S.grupoEscolhido : r[1];
    S.refGroups=[g1,g2]; renderTrans(); return;
  }
  if (stage==="ref"){ renderRes2(); return; }
  if (stage==="des"){ renderDeveria(); return; }
}

/* ======================= TELAS ======================= */
function progHTML(){
  const pct = Math.round((S.i)/(S.seq.length)*100);
  return `<div class="prog"><div class="row"><span>${esc(STAGE_LABEL[S.stage]||"")}</span><span>${S.i+1} de ${S.seq.length}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function renderQ(){
  S.screen="q";
  const q=S.seq[S.i];
  if (q.shuffle && !S.ord[q.id]) S.ord[q.id]=shuffle(q.opts.map(o=>o.k));
  const order = q.shuffle ? S.ord[q.id] : q.opts.map(o=>o.k);
  const byK = {}; q.opts.forEach(o=> byK[o.k]=o);
  const cur = S.ans[q.id];
  const isOn = k => q.kind==="multi" ? (Array.isArray(cur) && cur.indexOf(k)>=0) : cur===k;
  const opts = order.map(k=>{
    const o=byK[k];
    return `<button type="button" class="opt ${isOn(k)?"on":""}" data-k="${esc(k)}" role="${q.kind==="multi"?"checkbox":"radio"}" aria-checked="${isOn(k)}">${q.kind==="multi"?'<span class="box"></span>':""}<span>${esc(o.t)}</span></button>`;
  }).join("");
  let foot = "";
  if (q.kind==="multi"){
    const n = Array.isArray(cur)?cur.length:0;
    foot = `<button class="btn" id="go" style="margin-top:14px">${n? "Continuar" : "Nenhuma dessas — continuar"}</button>`;
  }
  app.innerHTML = `${progHTML()}
    <div class="q"><span class="typ">${esc(q.typ)}</span><h2>${esc(q.t)}</h2><div class="opts">${opts}</div>${foot}</div>
    ${S.i>0?'<button class="back" id="back">← voltar</button>':""}`;
  app.querySelectorAll(".opt").forEach(b=> b.addEventListener("click", ()=>{
    let k=b.dataset.k; if (q.kind==="likert") k=Number(k);
    if (q.kind==="multi"){
      const arr = Array.isArray(S.ans[q.id]) ? S.ans[q.id].slice() : [];
      const ix = arr.indexOf(k); if (ix>=0) arr.splice(ix,1); else arr.push(k);
      S.ans[q.id]=arr; renderQ(); return;
    }
    S.ans[q.id]=k;
    app.querySelectorAll(".opt").forEach(x=> x.classList.toggle("on", x===b));
    setTimeout(next, 220);
  }));
  const go=$("#go"); if (go) go.onclick=()=>{ if(!Array.isArray(S.ans[q.id])) S.ans[q.id]=[]; next(); };
  const bk=$("#back"); if (bk) bk.onclick=()=>{ S.i--; renderQ(); };
  scrollTop();
}

function groupCard(g, title, opts){
  opts = opts||{};
  const ms = G[g].m.map(k=>`<div class="mk"><b>${esc(M[k].n)}</b><span>“${esc(M[k].f)}”</span></div>`).join("");
  const tag = opts.pick ? "button" : "div";
  return `<${tag} ${opts.pick?'type="button" ':''}class="grp ${opts.pick?"pick":""}" data-g="${g}" style="--gc:var(--g-${g})"><div class="gt">${esc(title||G[g].n)}</div>${ms}</${tag}>`;
}
function choicesHTML(){
  return `<div class="choices">
    <button class="btn" data-v="sim">Sim, sou eu</button>
    <button class="btn ghost" data-v="parte">Em parte</button>
    <button class="btn ghost" data-v="nao">Não me vejo aqui</button></div>`;
}

function renderTrans(){
  S.screen="trans";
  const r=rank(groupScores()); const g1=r[0]; const tri1=rank(triScores())[0];
  let msg;
  if (S.lowPath) msg = "Suas primeiras respostas ficaram muito equilibradas, então fomos por outro caminho. Agora ficou mais claro.";
  else if (S.grupoEscolhido===g1) msg = "As perguntas indiretas concordaram com você.";
  else if (g1===tri1) msg = "As perguntas indiretas apontaram de novo para o mesmo lugar da primeira vez. Às vezes quem discorda é a própria máscara. Por isso a gente vai olhar os dois lados: esse e o que você escolheu.";
  else msg = "As perguntas indiretas mudaram o quadro. A gente vai olhar de perto este grupo e o que você escolheu.";
  app.innerHTML = `<div class="eyebrow">Recalculando</div>
    <h1 style="font-size:28px;margin:6px 0 10px">Agora a gente vai olhar de perto</h1>

    ${S.refGroups.map(g=>groupCard(g)).join("")}
    <button class="btn" id="go" style="margin-top:12px">Continuar</button>`;
  $("#go").onclick=()=> startStage("ref", qRef());
  scrollTop();
}

function barsHTML(scores, keys){
  const den = Math.max(10, ...keys.map(k=>scores[k]||0));
  const pc = v => Math.max(0, Math.min(100, Math.round((v||0)/den*100)));
  return keys.map(k=>`<div class="barrow" style="--gc:var(--g-${M[k].g})"><div class="bl">${esc(M[k].n)}</div><div class="bt"><i style="width:${pc(scores[k])}%"></i></div><div class="bv">${pc(scores[k])}%</div></div>`).join("");
}

function renderDeveria(){
  S.screen="deveria";

    <button class="link" id="skip">pular</button>`;
  const fin = v => { S.deveria=(v||"").trim().slice(0,40); renderFinal(); };
  $("#go").onclick=()=> fin($("#dev").value);
  $("#skip").onclick=()=> fin("");
  $("#dev").addEventListener("keydown", e=>{ if(e.key==="Enter") fin($("#dev").value); });

}

function computeResult(){
  const s=finalScores(); const r=rank(s);
  const principal=r[0], apoio=r[1]||null;
  let note="";
  const d = duelo();
  if (d){
    if (d.vb > d.va) note="As perguntas de desempate concordaram com você.";
    else if (d.va > d.vb) note="Você disse que não se via aqui, e o desempate apontou de novo para "+M[d.a].n+". Às vezes quem discorda é a própria máscara — e tudo bem. Fica com as duas e observa nas próximas semanas.";
    else note="Deu empate entre as duas. Elas estão aí juntas — observa qual aparece mais nas próximas semanas.";
  }
  const extra = (S.mascaraEscolhida && S.mascaraEscolhida!==principal && S.mascaraEscolhida!==apoio) ? S.mascaraEscolhida : null;
  return {scores:s, rank:r, principal, apoio, note, extra};
}

function renderFinal(){
  S.screen="final";
  const R=computeResult(); S.result=R;

    ${ex?`<div class="sec"><div class="eyebrow">Você também se vê em</div><h3 style="font-size:22px;margin:4px 0 2px">${esc(ex.n)}</h3>

    <div class="sec"><h3>Suas máscaras, de perto</h3><div class="card">${barsHTML(R.scores, R.rank)}</div></div>

  </div>`;

function payload(){
  const R=S.result;
  return {
    evento:EVENTO,
    email:S.who.email, cel:S.who.cel, modo:S.who.modo, uf:S.who.uf, tempo:S.who.tempo,

    scores:R.scores, principal_medida:S.principalMedida,
    ident2:S.ident2, mascara_escolhida:S.mascaraEscolhida,
    principal:R.principal, apoio:R.apoio,
    deveria:S.deveria || null,
    respostas:S.ans,
    duracao_s:Math.round((Date.now()-S.t0)/1000),
    ua:navigator.userAgent.slice(0,200)
  };
}
async function submit(){
  if (S.sent) return true;
  const body=JSON.stringify(payload());
  for (let tent=0; tent<3; tent++){
    try{
      const r = await fetch(SUPABASE_URL+"/rest/v1/respostas22", {method:"POST",
        headers:{"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json","Prefer":"return=minimal"}, body});
      if (r.ok){ S.sent=true; return true; }
    }catch(e){}
    await new Promise(res=>setTimeout(res, 1200*(tent+1)));
  }
  const m=$("#sendMsg");
  if (m){ m.innerHTML='<span class="err">Não consegui enviar a sua resposta.</span> <button class="link" id="retry">tentar de novo</button>'; $("#retry").onclick=()=> submit().then(ok=>{ if(ok){ m.textContent="Enviado. Ninguém vê a sua resposta individual — só o gráfico do grupo."; loadSala(); } }); }
  return false;
}
async function rpc(fn, args){
  const r = await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn, {method:"POST",
    headers:{"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json"}, body:JSON.stringify(args||{})});
  if (!r.ok) throw new Error("rpc "+r.status);
  return r.json();
}
let salaTimer=null;
async function loadSala(){
  const box=$("#sala"); if(!box) return;
  try{
    const d = await rpc("mascaras22_sala", {});
    const pr=d.principal||{}; const tot=d.total||0;
    if (!tot){ box.innerHTML='<p class="muted" style="margin:0">Você é a primeira resposta.</p>'; return; }
    const gr=zeroG(); Object.keys(pr).forEach(k=>{ if(M[k]) gr[M[k].g]+=pr[k]; });
    const mine = S.result && S.result.principal;
    const keys = Object.keys(pr).filter(k=>M[k]).sort((a,b)=>pr[b]-pr[a]);
    const pc = v => Math.round(v/tot*100);
    const row = (label, v, gc, me) => `<div class="barrow" style="--gc:${gc}"><div class="bl">${me?"<b>":""}${esc(label)}${me?" · você</b>":""}</div><div class="bt"><i style="width:${pc(v)}%"></i></div><div class="bv">${pc(v)}%</div></div>`;
    box.innerHTML = `<p class="muted" style="margin:0 0 10px">${tot} ${tot===1?"pessoa respondeu":"pessoas responderam"} até agora. Atualiza sozinho.</p>
      <div class="eyebrow" style="margin-bottom:2px">Por grupo · as que se escondem…</div>
      ${GORD.map(g=>row(G[g].n.replace("As que se escondem ",""), gr[g], "var(--g-"+g+")", mine && M[mine].g===g)).join("")}
      <div class="eyebrow" style="margin:14px 0 2px">Por máscara principal</div>
      ${keys.map(k=>row(M[k].n, pr[k], "var(--g-"+M[k].g+")", k===mine)).join("")}`;
  }catch(e){ box.innerHTML='<p class="muted" style="margin:0">O gráfico da sala aparece daqui a pouco.</p>'; }
  if (!salaTimer) salaTimer = setInterval(()=>{ if (S.screen==="final") loadSala(); }, 20000);
}

  </div>

    <div class="eyebrow" style="margin-bottom:4px">Antes de começar</div>
    <label for="email" class="lb">Seu e-mail</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com">
    <label for="cel" class="lb">Celular com DDD</label>
    <input id="cel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999">
    <label class="lb">Você está</label>
    <div class="seg" id="modo"><button type="button" data-v="presencial">Presencial</button><button type="button" data-v="online">Online</button></div>
    <label for="uf" class="lb">Estado onde você mora</label>
    <select id="uf"><option value="">Escolhe…</option>${UFS.map(u=>`<option>${u}</option>`).join("")}</select>
    <label for="tempo" class="lb">Há quanto tempo você estuda Vedanta?</label>
    <select id="tempo"><option value="">Escolhe…</option><option>Nunca estudei, tô começando agora</option><option>Menos de 1 ano</option><option>De 1 a 3 anos</option><option>Mais de 3 anos</option></select>
    <p class="muted" id="formMsg" style="margin:12px 0 0">E-mail e celular servem só pra cruzar com a base de alunos. Não aparecem no gráfico nem pra ninguém.</p>
  </div>
  <button class="btn" id="start" style="margin-top:14px">Começar</button>
  </section>`;
  $("#modo").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; S.who.modo=b.dataset.v; $("#modo").querySelectorAll("button").forEach(x=> x.classList.toggle("on", x===b)); });
  $("#start").onclick=()=>{
    const w=S.who;
    w.email=$("#email").value.trim().toLowerCase();
    w.cel=$("#cel").value.replace(/\D/g,"");
    w.uf=$("#uf").value; w.tempo=$("#tempo").value;
    const m=$("#formMsg"); const bad=s=>{ m.innerHTML='<span class="err">'+esc(s)+'</span>'; };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(w.email)) return bad("Confere o e-mail.");
    if (w.cel.length<10 || w.cel.length>13) return bad("Celular com DDD, só números.");
    if (!w.modo) return bad("Marca se você está presencial ou online.");
    if (!w.uf) return bad("Escolhe o estado.");
    if (!w.tempo) return bad("Diz há quanto tempo estuda Vedanta (ou que tá começando).");
    S.t0=Date.now();
    startStage("tri", qTri());
  };
  scrollTop();
}

/* ======================= PAINEL (#painel=TOKEN) ======================= */
let painelTimer=null;
async function renderPainel(token){
  document.body.classList.add("painel");
  const load = async ()=>{
    let d;
    try{ d = await rpc("mascaras22_painel", {p_token:token}); }catch(e){ app.innerHTML='<p class="err">Não consegui carregar o painel.</p>'; return; }
    if (!d || d.erro){ app.innerHTML='<p class="err">Token inválido.</p>'; return; }
    const tot=d.total||0, pr=d.principal||{}, md=d.modo||{}, r1=d.recusa1||{}, r2=d.recusa2||{}, dv=d.deveria||[];
    const gr=zeroG(); Object.keys(pr).forEach(k=>{ if(M[k]) gr[M[k].g]+=pr[k]; });
    const mk=Object.keys(M).sort((a,b)=>(pr[b]||0)-(pr[a]||0));
    const bar=(label,v,max,gc)=>`<div class="barrow" style="--gc:${gc}"><div class="bl">${esc(label)}</div><div class="bt"><i style="width:${max?Math.round(v/max*100):0}%"></i></div><div class="bv">${v}</div></div>`;
    const maxM=Math.max(1,...mk.map(k=>pr[k]||0));
    const recusadas=Object.keys(r2).filter(k=>M[k] && r2[k].n>=3).map(k=>({k, p:Math.round(r2[k].nao/r2[k].n*100), n:r2[k].n})).sort((a,b)=>b.p-a.p).slice(0,6);
    const n1=(r1.sim||0)+(r1.parte||0)+(r1.nao||0);
    const maxD=Math.max(1,...dv.map(x=>x.c));
    app.innerHTML = `<div class="eyebrow">Painel · ao vivo</div>
      <h1>Como a sala se dividiu</h1>
      <div class="pgrid">
        <div class="card"><div class="big">${tot}</div><p class="muted" style="margin:6px 0 0">respostas · presencial ${md.presencial||0} · online ${md.online||0}</p></div>
        <div class="card"><h3 style="margin-bottom:6px">Por grupo</h3>${GORD.map(g=>bar(G[g].n.replace("As que se escondem ",""), gr[g], Math.max(1,...GORD.map(x=>gr[x])), "var(--g-"+g+")")).join("")}</div>
        <div class="card" style="grid-column:1/-1"><h3 style="margin-bottom:6px">Máscara principal</h3>${mk.map(k=>bar(M[k].n, pr[k]||0, maxM, "var(--g-"+M[k].g+")")).join("")}</div>
        <div class="card"><h3 style="margin-bottom:6px">Quem não se reconheceu</h3>
          <p style="margin:0 0 10px">No primeiro resultado: <b>${n1?Math.round((r1.nao||0)/n1*100):0}%</b> disseram “não me vejo aqui” e ${n1?Math.round((r1.parte||0)/n1*100):0}% “em parte”.</p>
          <p class="muted" style="margin:0 0 6px">As máscaras mais recusadas no placar (mín. 3 pessoas):</p>
          ${recusadas.length? recusadas.map(x=>`<div class="mk"><b>${esc(M[x.k].n)}</b><span>${x.p}% recusaram (${x.n})</span></div>`).join("") : '<p class="muted" style="margin:0">Ainda poucas respostas.</p>'}
          <p class="muted" style="margin:10px 0 0">Escolheram um grupo diferente do que as respostas apontaram: <b>${d.auto_vs_medido||0}</b></p></div>
        <div class="card"><h3 style="margin-bottom:8px">“Eu deveria ser mais…”</h3>
          <div class="cloud">${dv.length? dv.map(x=>`<span style="font-size:${Math.round(16+ (x.c/maxD)*30)}px">${esc(x.w)}</span>`).join("") : '<span class="muted" style="font-family:inherit;font-weight:400">Ainda nada.</span>'}</div></div>
      </div>
      <p class="muted" style="margin-top:14px">Atualiza sozinho a cada 10 segundos.</p>`;
  };
  await load();
  painelTimer=setInterval(load, 10000);
}

/* ======================= ROTEAMENTO ======================= */
function route(){
  const hm = location.hash.match(/^#painel=(.+)$/);
  const mm = location.hash.match(/^#m-([a-z]+)$/);
  if (hm) renderPainel(decodeURIComponent(hm[1]));
  else if (mm && M[mm[1]]) renderMapaPage(mm[1]);
  else renderIntro();
}
window.addEventListener("hashchange", () => { if (S.screen !== "q" && S.screen !== "final") route(); });
route();

})();
